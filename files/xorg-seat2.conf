# Xorg config for the greeter X server of one seat. Used via lightdm.conf.d/50-seat2.conf.
# Disables screen blanking and DPMS so the greeter never issues the DPMS wake commit that can
# deadlock in vga_get() on a GPU that is not the boot VGA device (see README).

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Extensions"
    Option "DPMS" "Disable"
EndSection
